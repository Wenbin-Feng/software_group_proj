name: CI
on:
  push:
    branches-ignore: [release]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Validate deployment scripts
        run: |
          shellcheck deploy/*.sh
          node --check deploy/smoke.mjs
          node --check deploy/vercel-current.mjs
      - name: Install browser integration dependencies
        run: npx playwright install --with-deps chromium
      - name: Run browser integration checks
        run: node scripts/e2e.mjs
      - name: Run Google login browser checks with a local identity provider
        run: node scripts/e2e-google.mjs
      - name: Verify Linux backend packaging
        run: bash deploy/verify-image.sh folio-api:verify
      - name: Save browser integration results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: folio-ci-browser-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
