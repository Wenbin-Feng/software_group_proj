# Keep OAuth authorization codes/state and application query strings out of access logs.
log_format folio_safe '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent';

server {
    listen 80;
    server_name FOLIO_IP;
    server_tokens off;
    access_log /var/log/nginx/folio-access.log folio_safe;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/folio-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    server_name FOLIO_IP;
    server_tokens off;
    access_log /var/log/nginx/folio-access.log folio_safe;
    ssl_certificate /etc/letsencrypt/live/FOLIO_IP/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/FOLIO_IP/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FolioSSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 12m;

    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $http_x_forwarded_host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 100s;
        proxy_send_timeout 100s;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "private, no-store, max-age=0" always;
        add_header CDN-Cache-Control "no-store" always;
        add_header Vercel-CDN-Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / { return 404; }
}
